name: chromatic
glsl: |
  uniform float sampleCount;
  uniform float power;

  vec3 chromatic_slice(float t) {
    vec3 res = vec3(1.0 - t, 1.0 - abs(t - 1.0), t - 1.0);
    return max(res, 0.0);
  }

  void mainImage(out vec4 fragColor, in vec2 fragCoord){
    vec2 uv = fragCoord;
    vec3 sum = vec3(0.0);
    vec3 c = vec3(0.0);
    vec2 offset = (uv - vec2(0.5)) * vec2(1, -1);
    int sample_count = int(sampleCount);
    for (int i = 0; i < 64; ++i) {
      if (i >= sample_count) break;
      float t = 2.0 * float(i) / float(sample_count - 1); // range 0.0->2.0
      vec3 slice = vec3(1.0 - t, 1.0 - abs(t - 1.0), t - 1.0);
      slice = max(slice, 0.0);
      sum += slice;
      vec2 slice_offset = (t - 1.0) * power * offset;
      c += slice * tex2D(uv + slice_offset).rgb;
    }
    fragColor.rgb = c / sum;
    fragColor.a = 1;
  }
defaultVars:
  sampleCount:
    val: 3
    type: int
    range: [1, 64]
  power:
    val: 0.01
    type: float
