name: glitch
glsl: |
  uniform float time;
  uniform float power;
  uniform float rate;
  uniform float speed;
  uniform float blockCount;
  uniform float colorRate;

  float my_trunc(float x) {
    return x < 0.0? -floor(-x): floor(x);
  }

  float random(float seed) {
    return fract(543.2543 * sin(dot(vec2(seed, seed), vec2(3525.46, -54.3415))));
  }

  void mainImage(out vec4 fragColor, in vec2 fragCoord) {
    float enable_shift = float(random(my_trunc(time * speed)) < rate);

    vec2 fixed_uv = fragCoord;
    fixed_uv.x += (random((my_trunc(fragCoord.y * blockCount) / blockCount) + time) - 0.5) * power * enable_shift;

    vec4 pixel_color = tex2D(fixed_uv);
    pixel_color.r = mix(
      pixel_color.r,
      tex2D(fixed_uv + vec2(colorRate, 0.0)).r,
      enable_shift
    );
    pixel_color.b = mix(
      pixel_color.b,
      tex2D(fixed_uv + vec2(-colorRate, 0.0)).b,
      enable_shift
    );
    fragColor = pixel_color;
  }
defaultVars:
  power:
    val: 0.03
    type: float
  rate:
    val: 0.6
    type: float
    range: [0, 1]
  speed:
    val: 5.0
    type: float
  blockCount:
    val: 30.5
    type: float
  colorRate:
    val: 0.01
    type: float
    range: [0, 1]
